# ====================================================================
# uosc Configuration - Clean, Minimalist & Fast
# ====================================================================

# Timeline style: line or bar
timeline_style=line
timeline_line_width=2
timeline_size=36
timeline_border=1
timeline_step=5
timeline_cache=yes
timeline_heatmap=overlay

# Always visible thin progress bar when idle/controls hidden (windowed, fullscreen, always, never)
progress=windowed
progress_size=2
progress_line_width=20

# Controls above timeline
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,<video,audio>speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=30
controls_margin=8
controls_spacing=2

# Volume slider position (right, left, none)
volume=right
volume_size=38
volume_border=1
volume_step=2

# Speed widget
speed_step=0.05
speed_step_is_factor=no

# Menus (context menu, track pickers, chapter lists)
menu_item_height=34
menu_min_width=280
menu_padding=4
menu_type_to_search=yes

# Top bar (window controls and title)
top_bar=no-border
top_bar_size=38
top_bar_controls=right
top_bar_title=yes
top_bar_alt_title=${filename}
top_bar_alt_title_place=below
top_bar_flash_on=video,audio

# Styling & Animation
window_border_size=1
scale=1
scale_fullscreen=1.25
font_scale=1
text_border=1.2
border_radius=4
animation_duration=120
flash_duration=1000
proximity_in=40
proximity_out=120
font_bold=no
destination_time=playtime-remaining
time_precision=0
pause_indicator=flash

# Chapter highlight ranges (openings, endings, sponsor segments)
chapter_ranges=openings:30abf964,endings:30abf964,ads:c54e4e80

# Subtitle fetching
languages=slang,en
subtitles_directory=~~/subtitles

# Stream resolutions
stream_quality_options=4320,2160,1440,1080,720,480,360
