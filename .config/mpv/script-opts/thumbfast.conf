# ====================================================================
# thumbfast Configuration - On-the-fly Timeline Thumbnails
# ====================================================================

# Max thumbnail dimensions (pixels)
max_height=240
max_width=360

# Fast startup: spawn background thumbnailer when file loads
spawn_first=yes

# Close thumbnailer worker after 2 minutes of inactivity (0 to disable)
quit_after_inactivity=120

# Hardware decoding for instant thumbnail generation (leveraging RTX 4080)
hwdec=yes

# Disable for network playback to avoid unnecessary buffering/bandwidth
network=no
