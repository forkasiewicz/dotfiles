# ====================================================================
# Modern mpv Keybindings (Optimized for uosc & ergonomics)
# ====================================================================

# --------------------------------------------------------------------
# Mouse Controls
# --------------------------------------------------------------------
MBTN_LEFT           cycle pause; script-binding uosc/flash-pause-indicator
MBTN_LEFT_DBL       cycle fullscreen
MBTN_RIGHT          script-binding uosc/menu
MBTN_MID            ignore
WHEEL_UP            no-osd add volume  2; script-binding uosc/flash-volume
WHEEL_DOWN          no-osd add volume -2; script-binding uosc/flash-volume

# --------------------------------------------------------------------
# Playback & Window Controls
# --------------------------------------------------------------------
SPACE               cycle pause; script-binding uosc/flash-pause-indicator
ENTER               cycle fullscreen
f                   cycle fullscreen
ESC                 set fullscreen no
q                   quit
Q                   quit-watch-later

# --------------------------------------------------------------------
# Seeking & Navigation
# --------------------------------------------------------------------
RIGHT               seek  5; script-binding uosc/flash-timeline
LEFT                seek -5; script-binding uosc/flash-timeline
SHIFT+RIGHT         seek  30; script-binding uosc/flash-timeline
SHIFT+LEFT          seek -30; script-binding uosc/flash-timeline
CTRL+RIGHT          seek  1 exact
CTRL+LEFT           seek -1 exact
.                   frame-step; script-binding uosc/flash-pause-indicator
,                   frame-back-step; script-binding uosc/flash-pause-indicator

# --------------------------------------------------------------------
# Volume & Audio
# --------------------------------------------------------------------
UP                  no-osd add volume  5; script-binding uosc/flash-volume
DOWN                no-osd add volume -5; script-binding uosc/flash-volume
SHIFT+UP            no-osd add volume  1; script-binding uosc/flash-volume
SHIFT+DOWN          no-osd add volume -1; script-binding uosc/flash-volume
m                   no-osd cycle mute; script-binding uosc/flash-volume

# --------------------------------------------------------------------
# Playback Speed
# --------------------------------------------------------------------
[                   no-osd add speed -0.1; script-binding uosc/flash-speed
]                   no-osd add speed  0.1; script-binding uosc/flash-speed
{                   no-osd add speed -0.25; script-binding uosc/flash-speed
}                   no-osd add speed  0.25; script-binding uosc/flash-speed
\                   no-osd set speed 1.0; script-binding uosc/flash-speed
BS                  no-osd set speed 1.0; script-binding uosc/flash-speed

# --------------------------------------------------------------------
# Playlist & Chapters
# --------------------------------------------------------------------
>                   script-binding uosc/next; script-message-to uosc flash-elements top_bar,timeline
<                   script-binding uosc/prev; script-message-to uosc flash-elements top_bar,timeline
PGUP                add chapter -1; script-binding uosc/flash-timeline
PGDWN               add chapter  1; script-binding uosc/flash-timeline

# --------------------------------------------------------------------
# UI Toggles & Menus (uosc integration)
# --------------------------------------------------------------------
TAB                 script-binding uosc/toggle-ui
MENU                script-binding uosc/menu
p                   script-binding uosc/items
c                   script-binding uosc/chapters
o                   script-binding uosc/open-file
ctrl+v              script-binding uosc/paste
k                   script-binding uosc/keybinds
i                   script-binding stats.lua/display-stats-toggle
`                   script-binding console/enable

# --------------------------------------------------------------------
# Subtitles & Tracks (with uosc Context Menu structure #!)
# --------------------------------------------------------------------
s                   script-binding uosc/subtitles           #! Subtitles > Select Track
S                   script-binding uosc/load-subtitles      #! Subtitles > Load File
ctrl+s              script-binding uosc/download-subtitles  #! Subtitles > Download Online Subtitles
v                   cycle sub-visibility                    #! Subtitles > Toggle Visibility
z                   add sub-delay -0.1                      #! Subtitles > Timing: -100ms
x                   add sub-delay +0.1                      #! Subtitles > Timing: +100ms
r                   add sub-pos -1                          #! Subtitles > Move Up
t                   add sub-pos +1                          #! Subtitles > Move Down

a                   script-binding uosc/audio               #! Audio > Select Track
A                   script-binding uosc/load-audio          #! Audio > Load File
ctrl+a              script-binding uosc/audio-device        #! Audio > Output Device
ctrl+shift+left     add audio-delay -0.1                    #! Audio > Delay -100ms
ctrl+shift+right    add audio-delay +0.1                    #! Audio > Delay +100ms

# --------------------------------------------------------------------
# Context Menu Structure (#!)
# --------------------------------------------------------------------
#                   script-binding uosc/open-file           #! Navigation > Open File...
#                   script-binding uosc/items               #! Navigation > Playlist
#                   script-binding uosc/chapters            #! Navigation > Chapters
#                   script-binding uosc/paste               #! Navigation > Paste URL or Path

d                   cycle deband                            #! Video > Toggle Deband
D                   cycle deinterlace                       #! Video > Toggle Deinterlace
w                   cycle-values panscan 0.0 1.0            #! Video > Toggle Crop / Fill
ctrl+r              cycle-values video-rotate 90 180 270 0  #! Video > Rotate 90°
#                   cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1" #! Video > Aspect Ratio

