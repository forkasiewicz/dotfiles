MBTN_LEFT           cycle pause
MBTN_LEFT_DBL       cycle fullscreen
MBTN_RIGHT          script-binding select/context-menu
MBTN_MID            ignore
WHEEL_UP            add volume  2
WHEEL_DOWN          add volume -2

SPACE               cycle pause
ENTER               cycle fullscreen
f                   cycle fullscreen
ESC                 set fullscreen no
q                   quit
Q                   quit-watch-later

RIGHT               seek  5
LEFT                seek -5
SHIFT+RIGHT         seek  30
SHIFT+LEFT          seek -30
CTRL+RIGHT          seek  1 exact
CTRL+LEFT           seek -1 exact
.                   frame-step
,                   frame-back-step

UP                  add volume  5
DOWN                add volume -5
SHIFT+UP            add volume  1
SHIFT+DOWN          add volume -1
m                   cycle mute

[                   add speed -0.1
]                   add speed  0.1
{                   add speed -0.25
}                   add speed  0.25
\                   set speed 1.0
BS                  set speed 1.0

>                   playlist-next
<                   playlist-prev
PGUP                add chapter -1
PGDWN               add chapter  1

TAB                 script-binding modernz/visibility
MENU                script-binding select/context-menu
p                   script-binding select/select-playlist
c                   script-binding select/select-chapter
ctrl+v              loadfile ${clipboard/text} append-play
k                   script-binding select/select-binding
i                   script-binding stats/display-stats-toggle
`                   script-binding console/enable

V                   script-message-to modernz osc-visibility cycle
W                   script-binding modernz/progress-toggle
X                   script-message-to modernz osc-show
Y                   script-message-to modernz osc-hide

s                   script-binding select/select-sid
ctrl+s              script-binding select/select-secondary-sid
v                   cycle sub-visibility
z                   add sub-delay -0.1
x                   add sub-delay +0.1
r                   add sub-pos -1
t                   add sub-pos +1

a                   script-binding select/select-aid
ctrl+a              script-binding select/select-audio-device
ctrl+shift+left     add audio-delay -0.1
ctrl+shift+right    add audio-delay +0.1

d                   cycle deband
D                   cycle deinterlace
w                   cycle-values panscan 0.0 1.0
ctrl+r              cycle-values video-rotate 90 180 270 0
