save-position-on-quit=yes
keep-open=no
fullscreen=no
border=yes
autofit-larger=95%x95%
autofit-smaller=30%x30%
cursor-autohide=1000
cursor-autohide-fs-only=no

vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=auto-safe

video-sync=display-resample
interpolation=yes
tscale=oversample

scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

target-colorspace-hint=yes
dither-depth=auto
dither=fruit

osc=no
osd-bar=no
osd-font="Inter"
osd-font-size=28
osd-color="#EAEAEA"
osd-border-color="#141414"
osd-border-size=1.5
osd-shadow-offset=0

watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y

sub-auto=fuzzy
slang=en,eng,en-US
sub-font="Inter"
sub-font-size=40
sub-color="#FFFFFFFF"
sub-border-color="#FF141414"
sub-border-size=2.2
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5
sub-pos=95

volume=50
volume-max=130
audio-file-auto=fuzzy
audio-pitch-correction=yes

hr-seek=yes
hr-seek-framedrop=yes
prefetch-playlist=yes
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB

ytdl-format="bestvideo[height<=?1440]+bestaudio/best"

[protocol.http]
cache=yes
force-seekable=yes

[protocol.https]
cache=yes
force-seekable=yes

[extension.gif]
loop-file=inf

[image]
profile-cond=p["current-tracks/video/image"]
loop-file=yes
osc=no
osd-bar=no
