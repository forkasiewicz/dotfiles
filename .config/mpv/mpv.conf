# ====================================================================
# Modern mpv Configuration
# Optimized for performance, sleek modern UI, and zero bloat
# ====================================================================

# --------------------------------------------------------------------
# General & Window Behavior
# --------------------------------------------------------------------
save-position-on-quit=yes
keep-open=no                            # Set to 'yes' if you prefer pausing on the last frame
fullscreen=yes
border=no                               # Seamless borderless window (uosc draws controls)
autofit-larger=95%x95%
autofit-smaller=30%x30%
cursor-autohide=1000                    # Auto-hide cursor after 1s of inactivity
cursor-autohide-fs-only=no

# --------------------------------------------------------------------
# Video Output & GPU Acceleration (Vulkan + RTX 4080)
# --------------------------------------------------------------------
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk                   # Modern Wayland Vulkan context (falls back if needed)
hwdec=auto-safe                         # Native zero-copy hardware decoding (Vulkan/NVDEC)

# --------------------------------------------------------------------
# Motion Interpolation & Judder-Free Display Sync
# --------------------------------------------------------------------
video-sync=display-resample             # Resample audio to match display refresh rate
interpolation=yes                       # Smooth out 24fps motion judder on high-Hz displays
tscale=oversample                       # Artifact-free smooth motion interpolation

# --------------------------------------------------------------------
# Scaling & Image Quality
# --------------------------------------------------------------------
scale=ewa_lanczos                       # High quality luma upscaling (EWA Lanczos)
cscale=ewa_lanczos                      # High quality chroma upscaling
dscale=mitchell                         # Clean downscaling without ringing
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# --------------------------------------------------------------------
# Color Management & Dithering
# --------------------------------------------------------------------
target-colorspace-hint=yes              # Send HDR/colorspace hints to compositor
dither-depth=auto
dither=fruit

# --------------------------------------------------------------------
# Modern UI & OSD (Required for uosc)
# --------------------------------------------------------------------
osc=no                                  # Disable default OSC (uosc provides modern UI)
osd-bar=no                              # Disable default seekbar (uosc provides sleek bar)
osd-font="Inter"
osd-font-size=28
osd-color="#EAEAEA"
osd-border-color="#141414"
osd-border-size=1.5
osd-shadow-offset=0

# --------------------------------------------------------------------
# Subtitles (Clean Modern Typography)
# --------------------------------------------------------------------
sub-auto=fuzzy                          # Automatically load matching subtitles
slang=en,eng,en-US                      # Preferred subtitle languages
sub-font="Inter"
sub-font-size=40
sub-color="#FFFFFFFF"
sub-border-color="#FF141414"
sub-border-size=2.2
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5
sub-pos=95

# --------------------------------------------------------------------
# Audio
# --------------------------------------------------------------------
volume=50
volume-max=130
audio-file-auto=fuzzy                   # Auto-load external audio tracks
audio-pitch-correction=yes              # Maintain pitch when changing speed

# --------------------------------------------------------------------
# Fast Seeking & Caching
# --------------------------------------------------------------------
hr-seek=yes                             # High-precision seeking
hr-seek-framedrop=yes                   # Drop frames while seeking for instant response
prefetch-playlist=yes                   # Preload next file in playlist
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB

# --------------------------------------------------------------------
# Streaming / YouTube
# --------------------------------------------------------------------
ytdl-format="bestvideo[height<=?1440]+bestaudio/best"

# --------------------------------------------------------------------
# Profiles
# --------------------------------------------------------------------
[protocol.http]
cache=yes
force-seekable=yes

[protocol.https]
cache=yes
force-seekable=yes

[extension.gif]
loop-file=inf

[image]
profile-cond=p["current-tracks/video/image"]
loop-file=yes
osc=no
osd-bar=no
