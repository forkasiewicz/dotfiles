[env]
TERM = "alacritty"

[window]
title = "Terminal"
dynamic_title = true
dynamic_padding = false
decorations_theme_variant = "Dark"
dimensions = { columns = 174, lines = 50 }
option_as_alt = "OnlyLeft"

[font.normal]
family = "RobotoMono Nerd Font"
style = "Medium"

[font]
size = 15

[scrolling]
history = 100000

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 750
blink_timeout = 0

[colors]
draw_bold_text_with_bright_colors= false

[colors.primary]
background = '#1d2021'
foreground = '#d5c4a1'

[colors.normal]
black   = '#1d2021'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#d5c4a1'

[colors.bright]
black   = '#665c54'
red     = '#fe8019'
green   = '#3c3836'
yellow  = '#504945'
blue    = '#bdae93'
magenta = '#ebdbb2'
cyan    = '#d65d0e'
white   = '#fbf1c7'

[colors.cursor]
text='#1d2021'
cursor = '#d5c4a1'

[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
]

