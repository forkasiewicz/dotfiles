[env]
TERM = "alacritty"

[window]
title = "Terminal"
dynamic_title = true
decorations_theme_variant = "Dark"
dimensions = { columns = 90, lines = 40 }
option_as_alt = "Both"

[font.normal]
family = "Mononoki"

[font]
size = 16

[scrolling]
history = 100000

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 750
blink_timeout = 0

[colors.primary]
background = "#FCFBF9"
foreground = "#605A52"

[colors.normal]
black   = "#605A52"
red     = "#8F5652"
green   = "#747B4D"
yellow  = "#886A44"
blue    = "#556995"
magenta = "#83577D"
cyan    = "#477A7B"
white   = "#FCFBF9"

