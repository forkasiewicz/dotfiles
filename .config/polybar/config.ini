[colors]
background = #000000
foreground = #ffffff
dim = #666666

[bar/main]
width = 100%
height = 18pt
bottom = true
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 0
line-size = 0

padding-left = 0
padding-right = 0
module-margin = 1

separator =

font-0 = Cascadia Code:size=12;2

modules-left = xworkspaces
modules-right = cpu memory filesystem pulseaudio canberra time

enable-ipc = true
cursor-click = pointer

[module/xworkspaces]
type = internal/xworkspaces

label-active = "[%name%]"
label-active-padding = 0

label-occupied = " %name% "
label-occupied-padding = 0

label-empty = " %name% "
label-empty-padding = 0
label-empty-foreground = #666666

label-urgent = "!%name%!"
label-urgent-padding = 0
label-urgent-foreground = #FF0000

[module/cpu]
type = internal/cpu
label = CPU: %percentage%%

[module/memory]
type = internal/memory
label = RAM: %gb_used%/%gb_total%

[module/filesystem]
type = internal/fs
mount-0 = /

label-mounted = Disk: %free%
label-unmounted = Disk: N/A

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>

label-volume = VOL: %percentage%%
label-muted = VOL: MUTE

scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +1%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -1%

[module/time]
type = internal/date

date = %Y-%m-%d %H:%M:%S
label = %date%

[module/canberra]
type = internal/date

date = Canberra: %H:%M
time-zone = Australia/Canberra
label = %date%

[settings]
screenchange-reload = true
pseudo-transparency = true
